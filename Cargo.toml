[package]
name = "AuraDraw2"
version = "0.1.0"
edition = "2024"

[lib]
name = "aura_draw2"
path = "src/lib.rs"

[[bin]]
name = "aura_draw2"
path = "src/main.rs"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
console_error_panic_hook = "0.1"
reqwest = { version = "0.12", features = ["json"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Clipboard",
    "Navigator",
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "EventTarget",
    "Location",
    "Storage",
    "DomRect",
] }
