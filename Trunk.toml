[build]
target = "index.html"
# 关闭 trunk 注入的 CSP meta（Google Fonts 样式/字体加载更省心）
disable_csp = true

[serve]
address = "127.0.0.1"
port = 8080

# 本地开发：把 /api/* 请求转发到本地代理服务。
# 起一个本地代理即可（任选其一）：
#   RANDOM_ORG_API_KEY=xxx node dev/proxy.mjs
#   RANDOM_ORG_API_KEY=xxx python3 dev/proxy.py
# 代理健康检查：curl http://127.0.0.1:8787/healthz
[[proxy]]
backend = "http://127.0.0.1:8787"
rewrite = "/api"
